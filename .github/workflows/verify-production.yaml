name: Verify production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/verify-production.yaml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check containers and BT reverse proxies
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          docker ps --format '{{.Names}} {{.Status}} {{.Image}}'
          docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}'
          free -m
          df -h /
          for path in /health /app; do
            curl --fail --silent --show-error --max-time 30 -o /dev/null -w "backend $path %{http_code}\n" \
              -H 'Host: shop-admin.eurorefurb.com' "http://127.0.0.1$path"
          done
          curl --fail --silent --show-error --max-time 30 -o /dev/null -w 'storefront /dk %{http_code}\n' \
            -H 'Host: shop.eurorefurb.com' http://127.0.0.1/dk
          pgrep -af '^bash /opt/iphone-retail/releases/manual-' || true
          REMOTE
