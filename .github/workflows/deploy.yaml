name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to build and deploy (use all for first deployment)
        type: choice
        options: [all, backend, storefront]
        default: all
      deploy:
        description: Deploy after building (disable to publish bootstrap images only)
        type: boolean
        default: true

# Serialize entire releases; do not cancel migrations or a deployment in progress.
concurrency:
  group: production-deployment
  cancel-in-progress: false
permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/deploy-changes.test.cjs scripts/deploy-release.test.cjs
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AFTER: ${{ github.sha }}
          SELECTION: ${{ inputs.service }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Compare with the last successful automatic release, so failed or
          # superseded pushes are included in the next release's change set.
          before=''
          if [[ -z "$SELECTION" ]]; then
            before=$(gh api --method GET "repos/$GH_REPO/actions/workflows/deploy.yaml/runs" \
              -f event=push -f status=success -f branch="$BRANCH" -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty')
            if [[ -n "$before" ]] && ! git cat-file -e "$before^{commit}" 2>/dev/null; then before=''; fi
          fi
          node scripts/deploy-changes.cjs "$before" "$AFTER" "$SELECTION"

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            cpuset-cpus=0
            cpu-period=100000
            cpu-quota=100000
            memory=4g
            memory-swap=4g
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ vars.NEXT_PUBLIC_DEFAULT_REGION || 'dk' }}
            NEXT_PUBLIC_STRIPE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_KEY }}
            NEXT_PUBLIC_MEDUSA_PAYMENTS_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MEDUSA_PAYMENTS_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MEDUSA_PAYMENTS_ACCOUNT_ID=${{ vars.NEXT_PUBLIC_MEDUSA_PAYMENTS_ACCOUNT_ID }}

  deploy:
    needs: [changes, build]
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy selected services over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/iphone-retail' }}
          SERVICES: ${{ needs.changes.outputs.services }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_ROOT" != / ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ -n "$SSH_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          opts=(-i "$ssh_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=20)
          target="$SSH_USER@$SSH_HOST"
          release="$DEPLOY_ROOT/releases/$GITHUB_SHA"
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          backend=false
          storefront=false
          if [[ "$SERVICES" == *'"backend"'* ]]; then backend=true; fi
          if [[ "$SERVICES" == *'"storefront"'* ]]; then storefront=true; fi
          ssh "${opts[@]}" -p "$SSH_PORT" "$target" "mkdir -p '$release'"
          scp "${opts[@]}" -P "$SSH_PORT" deploy/compose.production.yaml deploy/deploy.sh "$target:$release/"
          # Use a project-specific registry config and short-lived workflow token.
          # Preserve registry credentials used by other applications on the server.
          printf '%s' "$REGISTRY_TOKEN" | ssh "${opts[@]}" -p "$SSH_PORT" "$target" \
            "export DOCKER_CONFIG='$DEPLOY_ROOT/.docker'; mkdir -p \"\$DOCKER_CONFIG\"; chmod 700 \"\$DOCKER_CONFIG\"; trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT; docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null && bash '$release/deploy.sh' '$DEPLOY_ROOT' '$prefix' '$GITHUB_SHA' '$backend' '$storefront'"
